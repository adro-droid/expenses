:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#e9e9ee,#2c2c2e);--ink:light-dark(#000,#fff);--sub:#8e8e93;--line:light-dark(#dcdce1,#38383a);--acc:light-dark(#007aff,#0a84ff);--red:light-dark(#ff3b30,#ff453a)}

{

  if(!all.length)return;
  $('#inc').onchange=e=>o.inc=e.target.checked;
  const msg=t=>$('#pm').textContent=t;
  let file=null;
  const base=repName(o.mode).replace(/ /g,'-')+(P?'-'+title.replace(/[^\w]+/g,'-'):'')+'-'+today();
  $('#pdf').onclick=async()=>{if(!window.jspdf||!window.jspdf.jsPDF){msg('The PDF maker did not load. Close and reopen the app.');return}
   msg('Preparing PDF…');try{all.forEach(e=>delete e._r);const rc=await receipts(all,o.inc);file=new File([buildPdf(R,title,rc)],base+'.pdf',{type:'application/pdf'})}catch(e){msg('Could not make the PDF.');return}finally{all.forEach(e=>delete e._r)}
   $('#pdf').hidden=true;$('#pgo').hidden=false;msg('Ready. Tap Save or print PDF, then choose Print or Save to Files.')};
  $('#pgo').onclick=()=>shareFile(file).then(()=>{msg(un?'Done. Tick the entries off below once they are in the books.':'Done.');const m=$('#mark');if(m)m.hidden=false}).catch(e=>{if(!e||e.name!=='AbortError')msg('Could not open the share sheet.')});
  const m=$('#mark');if(m)m.onclick=()=>{const ids=all.map(e=>e.id);all.forEach(e=>{e.done=true;e.doneAt=today()});save();closeSheet();rerender();
   toast(`${ids.length} entries marked recorded`,()=>{S.entries.forEach(e=>{if(ids.includes(e.id)){e.done=false;e.doneAt=null}});save();rerender()})}};
 draw()}

/* ---------- events ---------- */
function quick(t){t=t.trim();const m=t.match(/(?:^|\s)(?:₱|php\s?)?(\d[\d,]*(?:\.\d{1,2})?)$/i);return m?{desc:t.slice(0,m.index).trim(),amt:parseAmt(m[1])}:{desc:t,amt:0}}
root.addEventListener('click',ev=>{const T=ev.target;
 const g=T.closest('[data-go]');if(g){go(g.dataset.go);return}
 const c=T.closest('[data-chk]');if(c){const e=S.entries.find(x=>x.id===c.dataset.chk);if(!e)return;e.done=!e.done;e.doneAt=e.done?today():null;save();
  const el=c.closest('.card');el.classList.toggle('done',e.done);if(e.done&&!(cur&&ui.showDone)&&location.hash!=='#s-all'&&location.hash!=='#s-done'&&location.hash!=='#s-today')el.style.opacity='.35';setTimeout(rerender,700);return}
 const o=T.closest('[data-open]');if(o){openEntry(o.dataset.open);return}
 const j=T.closest('[data-jump]');if(j){const b=$('#board');b.children[+j.dataset.jump].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});return}
 const b=T.closest('button[id]');if(!b)return;
 ({bPrint:()=>openPrint(),bPrintAll:()=>openPrint(null,'all'),bMenu:openMenu,bAddP:()=>openProject(),bPrintP:()=>openPrint(cur.id),bPMenu:()=>openProject(cur),
   bShow:()=>{ui.showDone=!ui.showDone;saveUi();rerender()},fab:()=>openEntry(null,{pid:cur.id,col:COLS[visCol()][0]})}[b.id]||(()=>{}))()});
root.addEventListener('submit',ev=>{const f=ev.target.closest('form.add');if(!f)return;ev.preventDefault();const inp=f.querySelector('input'),t=inp.value;if(!t.trim()||!cur)return;
 const k=f.dataset.col,{desc,amt}=quick(t);S.entries.push({id:uid(),pid:cur.id,col:k,desc,amt,date:today(),time:nowHM(),notes:'',done:false});save();rerender();
 const ni=document.querySelector(`form.add[data-col="${k}"] input`);if(ni)ni.focus({preventScroll:true})});
root.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value;$('#hb').innerHTML=homeBody()}});

/* ---------- start ---------- */
(async()=>{await load();route();
 try{const keys=await idbKeys('photos'),refs=new Set(S.entries.map(e=>e.img));for(const k of keys)if(!refs.has(k))await idbDel('photos',k)}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script></body></html>
